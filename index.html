<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boo-Vac</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas class="webgl"></canvas>
  <div id="ui">
    <div id="crosshair" class="hidden"></div>
    <div id="hud" class="hidden">
      <div class="tank-label">Sucked up: <span class="tank-count">0</span></div>
    </div>
    <div id="max" class="hidden">
      <div class="max-key">F</div>
      <div class="max-label">MAX</div>
      <div class="max-bar"><div class="max-fill"></div></div>
    </div>
    <div id="fps" class="hidden"></div>
    <div id="start" class="overlay">
      <h1>Boo-Vac</h1>
      <p class="action">Click to start</p>
      <p class="controls">WASD walk · Space jump · Mouse look · Left mouse suck · Right mouse blow · F MAX · Esc pause</p>
    </div>
    <div id="pause" class="overlay hidden">
      <h1>Paused</h1>
      <p class="action">Click to resume</p>
    </div>
  </div>
  <script type="module" src="js/script.js"></script>
</body>
</html>
